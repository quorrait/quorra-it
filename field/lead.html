<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Request service</title>
<style>
  :root { --brand:#e8590c; --brand-dark:#c24a0a; --ink:#0f172a; --muted:#64748b; --line:#dbe1ea; --soft:#f6f8fb; --bad:#b42318; --good:#137a3c; }
  * { box-sizing: border-box; }
  html, body { margin:0; }
  body { font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:transparent; padding:12px; }
  .card { max-width:560px; margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 6px 24px rgba(15,23,42,.07); overflow:hidden; }
  .head { padding:20px 22px 16px; background:linear-gradient(135deg,#0f2742,#17395f); color:#fff; }
  .head h1 { font-size:21px; margin:0 0 4px; letter-spacing:-.01em; }
  .head p { margin:0; color:#cbd7e6; font-size:14px; }
  .biz { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#ffb27a; font-weight:700; margin-bottom:6px; }
  form { padding:20px 22px 22px; display:grid; gap:14px; }
  label { display:grid; gap:5px; font-weight:600; font-size:13px; color:#1e293b; }
  input, textarea { font:inherit; font-weight:400; padding:12px 13px; border:1px solid var(--line); border-radius:10px; background:var(--soft); color:var(--ink); width:100%; }
  input::placeholder, textarea::placeholder { color:#94a3b8; }
  input:focus, textarea:focus { outline:none; border-color:var(--brand); background:#fff; box-shadow:0 0 0 3px rgba(232,89,12,.18); }
  textarea { min-height:96px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:480px) { .row { grid-template-columns:1fr; } .head, form { padding-left:16px; padding-right:16px; } }
  button { font:inherit; font-weight:700; padding:14px; border:0; border-radius:10px; background:var(--brand); color:#fff; cursor:pointer; font-size:16px; }
  button:hover:not(:disabled) { background:var(--brand-dark); }
  button:disabled { opacity:.6; cursor:default; }
  .hint { font-size:12px; color:var(--muted); text-align:center; margin:0; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .msg { padding:12px 14px; border-radius:10px; font-weight:600; font-size:14px; }
  .msg:empty { display:none; }
  .err { background:#fef3f2; color:var(--bad); }
  .ok { background:#ecfdf3; color:var(--good); }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="biz" id="biz"></div>
    <h1 id="h">Request service</h1>
    <p id="intro">Tell us what you need and we will get back to you shortly.</p>
  </div>
  <form id="f" novalidate>
    <div class="row">
      <label>Full name *<input name="name" autocomplete="name" placeholder="Jane Smith" required /></label>
      <label>Phone<input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="(555) 123-4567" /></label>
    </div>
    <label id="lemail">Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" /></label>
    <label id="laddr">Service address<input name="address" autocomplete="street-address" placeholder="Street, city" /></label>
    <label id="lservice">What do you need done?<input name="service" placeholder="e.g. AC not cooling, water heater replacement" /></label>
    <label id="lextra" style="display:none"><span id="extraLabel"></span><input name="extra" /></label>
    <label>Additional details<textarea name="message" placeholder="Anything that will help us prepare"></textarea></label>
    <div class="hp" aria-hidden="true"><label>Leave blank<input name="hp" tabindex="-1" autocomplete="off" /></label></div>
    <div id="out" role="status"></div>
    <button id="go" type="submit">Request service</button>
    <p class="hint" id="hint">Provide a phone number or email so we can reach you.</p>
  </form>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var key = q.get("k"), api = q.get("api"), demo = q.get("demo") === "1", name = q.get("n"), anon = q.get("a");
  var f = document.getElementById("f"), out = document.getElementById("out"), go = document.getElementById("go");
  var cfg = {};
  if (name) document.getElementById("biz").textContent = name;
  function show(cls, text) { out.className = "msg " + cls; out.textContent = text; }
  function shade(hex, amt) { var n = parseInt(hex.slice(1), 16), r = Math.max(0, (n >> 16) - amt), g = Math.max(0, ((n >> 8) & 255) - amt), b = Math.max(0, (n & 255) - amt); return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); }
  function apply(c) {
    cfg = c || {};
    if (cfg.heading) { document.getElementById("h").textContent = cfg.heading; document.title = cfg.heading; }
    if (cfg.intro) document.getElementById("intro").textContent = cfg.intro;
    if (cfg.button) go.textContent = cfg.button;
    if (cfg.accent && /^#[0-9a-f]{6}$/i.test(cfg.accent)) { document.documentElement.style.setProperty("--brand", cfg.accent); document.documentElement.style.setProperty("--brand-dark", shade(cfg.accent, 24)); }
    if (cfg.show_address === false) document.getElementById("laddr").style.display = "none";
    if (cfg.show_email === false) document.getElementById("lemail").style.display = "none";
    if (cfg.require_phone) { document.getElementById("phone").required = true; document.getElementById("hint").textContent = "Please include a phone number so we can reach you."; }
    if (cfg.extra_label) { document.getElementById("lextra").style.display = ""; document.getElementById("extraLabel").textContent = cfg.extra_label; }
    if (cfg.services && cfg.services.length) {
      var sel = document.createElement("select"); sel.name = "service";
      sel.style.cssText = "font:inherit;font-weight:400;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);width:100%";
      var o0 = document.createElement("option"); o0.value = ""; o0.textContent = "Choose a service"; sel.appendChild(o0);
      cfg.services.forEach(function (x) { var o = document.createElement("option"); o.value = x; o.textContent = x; sel.appendChild(o); });
      var lab = document.getElementById("lservice"); lab.removeChild(lab.querySelector("input")); lab.appendChild(sel);
    }
  }
  // Wording comes from the preview link, or from the business's saved settings.
  if (q.get("cfg")) { try { apply(JSON.parse(decodeURIComponent(escape(atob(q.get("cfg")))))); } catch (e) {} }
  else if (!demo && key && api && anon) {
    fetch(api.replace(/\/functions\/v1\/?$/, "") + "/rest/v1/rpc/lead_form_config", { method: "POST", headers: { "Content-Type": "application/json", apikey: anon, Authorization: "Bearer " + anon }, body: JSON.stringify({ p_key: key }) })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j) { if (j.name && !name) document.getElementById("biz").textContent = j.name; apply(j.form); } })
      .catch(function () {});
  }
  if (!demo && (!key || !api)) show("err", "This form is not set up correctly.");
  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var d = Object.fromEntries(new FormData(f).entries());
    if (!d.name.trim()) return show("err", "Please enter your name.");
    if (cfg.require_phone && !(d.phone || "").trim()) return show("err", "Please enter a phone number.");
    if (!(d.phone || "").trim() && !(d.email || "").trim()) return show("err", "Please enter a phone number or email so we can reach you.");
    if (d.extra && cfg.extra_label) d.message = ((d.message || "") + "\n" + cfg.extra_label + ": " + d.extra).trim();
    delete d.extra;
    var thanks = cfg.thanks || "Thank you. Your request was sent and we will contact you shortly.";
    if (demo) { f.reset(); return show("ok", "Preview only: on your live form this request would now appear under Leads."); }
    d.k = key; go.disabled = true; show("", "");
    fetch(api.replace(/\/$/, "") + "/lead-intake", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (r) {
        if (!r.ok) { go.disabled = false; return show("err", r.j.error || "Something went wrong. Please try again."); }
        f.reset(); go.textContent = "Request sent";
        show("ok", thanks);
      })
      .catch(function () { go.disabled = false; show("err", "Could not send your request. Please check your connection and try again."); });
  });
})();
</script>
</body>
</html>
