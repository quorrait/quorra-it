<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quorra IT</title>
    <meta name="description" content="Managed IT & cybersecurity services for small businesses. Let's fix what isn't working." />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        :root {
            --q-bg: #15140F;
            --q-ink: #F4F1EA;
            --q-ink-2: #C9C3B7;
            --q-ink-3: #8A847A;
            --q-rule: rgba(244,241,234,0.16);
            --q-rule-soft: rgba(244,241,234,0.08);
            --q-card: #1D1B16;
            --q-accent: #1CAADE;
            --q-sans: "Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
            --q-mono: "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
            --q-max: 1240px;
            --q-gutter: 40px;
        }
        *{box-sizing:border-box;}
        html,body{margin:0;padding:0;}
        body{font-family:var(--q-sans);background:var(--q-bg);color:var(--q-ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
        a{color:inherit;text-decoration:none;}
        .q-eyebrow{font-family:var(--q-mono);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--q-ink-3);}
        .q-nav{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:18px var(--q-gutter);background:color-mix(in srgb,var(--q-bg) 82%,transparent);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--q-rule-soft);}
        .q-brand{display:inline-flex;align-items:center;gap:10px;font-weight:500;font-size:18px;letter-spacing:-.01em;color:var(--q-ink);}
        .q-brand-logo{height:36px;width:auto;display:block;}
        .q-nav-links{list-style:none;margin:0;padding:0;display:flex;gap:28px;justify-self:center;}
        .q-nav-links a{font-size:13.5px;color:var(--q-ink-2);transition:color .2s;}
        .q-nav-links a:hover{color:var(--q-ink);}
        .q-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 22px;font-size:14px;font-weight:500;border-radius:999px;border:1px solid transparent;cursor:pointer;transition:all .2s ease;font-family:var(--q-sans);}
        .q-btn-primary{background:var(--q-ink);color:var(--q-bg);}
        .q-btn-primary:hover{background:var(--q-accent);color:#fff;}
        .q-btn-ghost{background:transparent;border-color:var(--q-rule);color:var(--q-ink);}
        .q-btn-ghost:hover{border-color:var(--q-ink);}
        .q-hero{max-width:var(--q-max);margin:0 auto;padding:160px var(--q-gutter) 140px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px;}
        .q-hero-title{font-weight:500;font-size:clamp(64px,10vw,140px);line-height:.95;letter-spacing:-.04em;margin:0;color:var(--q-accent);}
        .q-hero-title .q-it{color:var(--q-ink);}
        .q-hero-sub{max-width:48ch;font-size:18px;line-height:1.5;color:var(--q-ink-2);margin:0;}
        .q-hero-cta{display:flex;gap:12px;margin-top:8px;}
        .q-section{max-width:var(--q-max);margin:0 auto;padding:96px var(--q-gutter);border-top:1px solid var(--q-rule);}
        .q-section-head{display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:64px;text-align:center;}
        .q-section-head .q-eyebrow{padding-top:14px;}
        .q-section-title{font-weight:500;font-size:clamp(40px,5vw,60px);line-height:1.02;letter-spacing:-.03em;margin:0;color:var(--q-accent);text-align:center;}
        .q-stack{border-top:1px solid var(--q-rule);padding:56px var(--q-gutter);max-width:var(--q-max);margin:0 auto;}
        .q-stack-head{display:grid;grid-template-columns:160px 1fr;gap:40px;align-items:center;margin-bottom:36px;}
        .q-stack-logos{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
        .q-stack-logo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:90px;width:110px;padding:16px 12px 12px;background:var(--q-card);border:1px solid var(--q-rule);border-radius:12px;transition:border-color .2s,transform .2s;}
        .q-stack-logo:hover{border-color:var(--q-accent);transform:translateY(-2px);}
        .q-stack-logo img{width:48px;height:48px;object-fit:contain;display:block;}
        .q-stack-logo img.white-logo{filter:brightness(0) invert(1);width:80px;height:auto;}
        .q-service-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
        .q-service-card{position:relative;display:flex;flex-direction:column;gap:24px;padding:40px 36px 36px;background:var(--q-card);border:1px solid var(--q-rule);border-radius:16px;transition:transform .3s ease,box-shadow .3s ease;}
        .q-service-card:hover{transform:translateY(-2px);box-shadow:0 20px 40px -24px rgba(0,0,0,.4);}
        .q-service-header{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--q-rule-soft);}
        .q-service-name{font-weight:500;font-size:32px;letter-spacing:-.02em;margin:0;color:var(--q-ink);}
        .q-service-summary{font-size:16px;line-height:1.5;color:var(--q-ink-2);margin:0;max-width:38ch;}
        .q-service-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;flex:1;}
        .q-service-list li{display:flex;gap:12px;padding:12px 0;font-size:14.5px;color:var(--q-ink-2);border-bottom:1px solid var(--q-rule-soft);}
        .q-service-list li:last-child{border-bottom:0;}
        .q-service-dash{color:var(--q-accent);font-family:var(--q-mono);}
        .q-service-link{font-size:14px;font-weight:500;color:var(--q-ink);align-self:flex-start;padding-bottom:2px;border-bottom:1px solid var(--q-ink);transition:color .2s,border-color .2s;}
        .q-service-link:hover{color:var(--q-accent);border-color:var(--q-accent);}
        .q-contact{padding-bottom:96px;}
        .q-contact-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:80px;align-items:start;}
        .q-contact-title{font-weight:500;font-size:clamp(44px,5.5vw,72px);line-height:.98;letter-spacing:-.03em;margin:16px 0 28px;color:var(--q-ink);}
        .q-contact-body{font-size:16px;color:var(--q-ink-2);max-width:40ch;}
        .q-contact-details{display:grid;grid-template-columns:1fr 1fr;gap:28px 40px;margin:48px 0 0;padding-top:36px;border-top:1px solid var(--q-rule);}
        .q-contact-details dt{font-family:var(--q-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--q-ink-3);margin-bottom:6px;}
        .q-contact-details dd{margin:0;font-size:14.5px;color:var(--q-ink);line-height:1.5;}
        .q-contact-details a{border-bottom:1px solid var(--q-rule);}
        .q-contact-details a:hover{border-color:var(--q-ink);}
        .q-form{background:var(--q-card);border:1px solid var(--q-rule);border-radius:16px;padding:36px 36px 28px;display:flex;flex-direction:column;gap:20px;}
        .q-form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
        .q-field{display:flex;flex-direction:column;gap:6px;}
        .q-field>span{font-family:var(--q-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--q-ink);}
        .q-field input,.q-field textarea{font-family:var(--q-sans);font-size:15px;color:var(--q-ink);background:transparent;border:0;border-bottom:1px solid var(--q-rule);padding:8px 0;outline:none;transition:border-color .2s;width:100%;resize:vertical;}
        .q-field input:focus,.q-field textarea:focus{border-bottom-color:var(--q-ink);}
        .q-field input::placeholder,.q-field textarea::placeholder{color:var(--q-ink-3);}
        .q-form-foot{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-top:12px;border-top:1px solid var(--q-rule-soft);}
        .q-form-note{font-family:var(--q-mono);font-size:11px;color:var(--q-ink-3);}
        .q-contact-thanks{background:var(--q-card);border:1px solid var(--q-rule);border-radius:16px;padding:56px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;}
        .q-contact-thanks h3{font-size:32px;font-weight:500;margin:8px 0 0;letter-spacing:-.02em;color:var(--q-ink);}
        .q-contact-thanks p{color:var(--q-ink-2);margin:0;max-width:40ch;}
        .q-footer{border-top:1px solid var(--q-rule);padding:64px var(--q-gutter) 32px;max-width:var(--q-max);margin:0 auto;}
        .q-footer-top{display:grid;grid-template-columns:1fr 2fr;gap:80px;padding-bottom:48px;border-bottom:1px solid var(--q-rule-soft);}
        .q-footer-brand{display:flex;gap:14px;align-items:flex-start;}
        .q-footer-name{font-weight:500;font-size:20px;letter-spacing:-.01em;color:var(--q-ink);}
        .q-footer-tag{font-size:13px;color:var(--q-ink-3);margin-top:2px;}
        .q-footer-cols{display:grid;grid-template-columns:repeat(2,1fr);gap:40px;}
        .q-footer-cols h4{font-family:var(--q-mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--q-ink-3);margin:0 0 16px;}
        .q-footer-cols ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
        .q-footer-cols li,.q-footer-cols a{font-size:13.5px;color:var(--q-ink-2);}
        .q-footer-cols a:hover{color:var(--q-ink);}
        .q-footer-bottom{padding-top:24px;display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--q-ink-3);font-family:var(--q-mono);align-items:center;}
        .q-footer-sep{opacity:.5;}
        .q-footer-link{background:none;border:none;padding:0;font-family:var(--q-mono);font-size:12px;color:var(--q-ink-3);cursor:pointer;transition:color .2s;}
        .q-footer-link:hover{color:var(--q-ink);}
        .q-modal-backdrop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;animation:q-fade-in .18s ease;}
        @keyframes q-fade-in{from{opacity:0}to{opacity:1}}
        @keyframes q-slide-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
        .q-modal{background:var(--q-card);border:1px solid var(--q-rule);border-radius:20px;width:100%;max-width:680px;max-height:82vh;display:flex;flex-direction:column;animation:q-slide-up .22s ease;overflow:hidden;}
        .q-modal-header{display:flex;align-items:center;justify-content:space-between;padding:28px 32px 20px;border-bottom:1px solid var(--q-rule-soft);flex-shrink:0;}
        .q-modal-header h2{font-weight:500;font-size:22px;letter-spacing:-.02em;margin:0;color:var(--q-ink);}
        .q-modal-close{background:none;border:1px solid var(--q-rule);color:var(--q-ink-3);width:36px;height:36px;border-radius:999px;cursor:pointer;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s;flex-shrink:0;}
        .q-modal-close:hover{border-color:var(--q-ink);color:var(--q-ink);}
        .q-modal-body{overflow-y:auto;padding:28px 32px 40px;flex:1;}
        .q-modal-body::-webkit-scrollbar{width:4px;}
        .q-modal-body::-webkit-scrollbar-track{background:transparent;}
        .q-modal-body::-webkit-scrollbar-thumb{background:var(--q-rule);border-radius:2px;}
        .q-modal-meta{font-family:var(--q-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--q-ink-3);margin:0 0 32px;display:block;}
        .q-modal-body h3{font-family:var(--q-mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--q-ink);margin:32px 0 10px;}
        .q-modal-body h3:first-of-type{margin-top:0;}
        .q-modal-body p{font-size:14px;line-height:1.75;color:var(--q-ink-2);margin:0 0 12px;}
        .q-modal-body a{color:var(--q-accent);border-bottom:1px solid rgba(28,170,222,.3);transition:border-color .2s;}
        .q-modal-body a:hover{border-color:var(--q-accent);}
        @media(max-width:960px){
            .q-nav-links{display:none;}
            .q-hero{padding:100px var(--q-gutter) 80px;}
            .q-section-head{grid-template-columns:1fr;gap:20px;padding-bottom:40px;}
            .q-stack-head{grid-template-columns:1fr;gap:12px;}
            .q-service-grid{grid-template-columns:1fr;}
            .q-contact-grid{grid-template-columns:1fr;gap:40px;}
            .q-footer-top{grid-template-columns:1fr;gap:32px;}
            .q-footer-cols{grid-template-columns:repeat(2,1fr);gap:20px;}
            .q-form-row{grid-template-columns:1fr;}
            .q-modal{max-height:90vh;}
            .q-modal-header{padding:20px 20px 16px;}
            .q-modal-body{padding:20px 20px 32px;}
        }
    </style>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>

</head>

        function Modal({ title, children, onClose }) {
            React.useEffect(() => {
                const prev = document.body.style.overflow;
                document.body.style.overflow = "hidden";
                const onKey = (e) => { if (e.key === "Escape") onClose(); };
                window.addEventListener("keydown", onKey);
                return () => { document.body.style.overflow = prev; window.removeEventListener("keydown", onKey); };
            }, [onClose]);
            return (
                <div className="q-modal-backdrop" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="q-modal" role="dialog" aria-modal="true" aria-label={title}>
                        <div className="q-modal-header">
                            <h2>{title}</h2>
                            <button className="q-modal-close" onClick={onClose} aria-label="Close">×</button>
                        </div>
                        <div className="q-modal-body">{children}</div>
                    </div>
                </div>
            );

        function Contact() {
            const [name, setName] = React.useState("");
            const [submitted, setSubmitted] = React.useState(false);
            const [sending, setSending] = React.useState(false);
            const submit = async (e) => {
                e.preventDefault(); setSending(true);
                try {
                    const res = await fetch("https://api.web3forms.com/submit", {method:"POST",headers:{"Accept":"application/json"},body:new FormData(e.target)});
                    const json = await res.json();
                    if (json.success) { setSubmitted(true); } else { alert("Something went wrong: " + (json.message||"unknown error")); }
                } catch { alert("Network error — please email us directly at support@quorrait.com"); }
                finally { setSending(false); }
            };
            return (
                <section className="q-section q-contact" id="contact">
                    <div className="q-contact-grid">
                        <div>
                            <span className="q-eyebrow">Contact</span>
                            <h2 className="q-contact-title" style={{color:"var(--q-accent)"}}>Let's fix what isn't working</h2>

                                <div><dt>Phone</dt><dd><a href="tel:+19168669705">(916) 866-9705</a></dd></div>
                                <div><dt>Hours</dt><dd>Mon–Fri, 8am–6pm PT</dd></div>
                                <div><dt>Emergency</dt><dd>24/7 on-call line</dd></div>
                            </dl>
                        </div>
                        <div>

                                    <p>We'll reply within 1–2 business days — usually much sooner. If it's urgent, our emergency line is always open.</p>
                                    <button className="q-btn q-btn-ghost" onClick={() => setSubmitted(false)}>Send another</button>
                                </div>
                            ) : (
                                <form className="q-form" onSubmit={submit}>

                                    <input type="hidden" name="subject" value="New enquiry from quorrait.com" />

                                    </div>
                                </form>
                            )}
                        </div>
                    </div>
                </section>
            );
        }
