    <style>
        :root {
            --q-bg: #15140F;
            --q-ink: #F4F1EA;
            --q-ink-2: #C9C3B7;
            --q-ink-3: #8A847A;
            --q-rule: rgba(244, 241, 234, 0.16);
            --q-rule-soft: rgba(244, 241, 234, 0.08);
            --q-card: #1D1B16;
            --q-accent: #1CAADE;
            --q-hi-bg: #F4F1EA;
            --q-hi-fg: #15140F;
            --q-hi-fg-muted: rgba(21, 20, 15, 0.65);
            --q-hi-rule: rgba(21, 20, 15, 0.14);
            --q-sans: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            --q-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
            --q-display: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            --q-max: 1240px;
            --q-gutter: 40px;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body {
            font-family: var(--q-sans);
            background: var(--q-bg);
            color: var(--q-ink);
            font-size: 15px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        a { color: inherit; text-decoration: none; }
        em { font-style: italic; }

        .q-eyebrow {
            font-family: var(--q-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--q-ink-3);
        }

        /* Nav */
        .q-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 24px;
            padding: 18px var(--q-gutter);
            background: color-mix(in srgb, var(--q-bg) 82%, transparent);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            border-bottom: 1px solid var(--q-rule-soft);
        }

        .q-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--q-sans);
            font-weight: 500;
            font-size: 18px;
            letter-spacing: -0.01em;
            color: var(--q-ink);
        }

        .q-brand-logo {
            height: 36px;
            width: auto;
            display: block;
        }

        .q-nav-links {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 28px;
            justify-self: center;
        }

        .q-nav-links a {
            font-size: 13.5px;
            color: var(--q-ink-2);
            transition: color 0.2s;
        }

        .q-nav-links a:hover { color: var(--q-ink); }

        .q-nav-cta {
            justify-self: end;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            padding: 9px 16px;
            border: 1px solid var(--q-ink);
            border-radius: 999px;
            transition: background 0.2s, color 0.2s;
        }

        .q-nav-cta:hover { background: var(--q-ink); color: var(--q-bg); }

        /* Buttons */
        .q-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 46px;
            padding: 0 22px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 999px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--q-sans);
        }

        .q-btn-primary { background: var(--q-ink); color: var(--q-bg); }
        .q-btn-primary:hover { background: var(--q-accent); color: #fff; }
        .q-btn-ghost { background: transparent; border-color: var(--q-rule); color: var(--q-ink); }
        .q-btn-ghost:hover { border-color: var(--q-ink); }
        .q-btn-outline { background: transparent; border-color: var(--q-ink); color: var(--q-ink); }
        .q-btn-outline:hover { background: var(--q-ink); color: var(--q-bg); }

        /* Hero */
        .q-hero {
            max-width: var(--q-max);
            margin: 0 auto;
            padding: 160px var(--q-gutter) 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 28px;
        }

        .q-hero-title {
            font-family: var(--q-display);
            font-weight: 500;
            font-size: clamp(64px, 10vw, 140px);
            line-height: 0.95;
            letter-spacing: -0.04em;
            margin: 0;
            color: var(--q-accent);
        }

        .q-hero-title .q-it { color: var(--q-ink); }

        .q-hero-sub {
            max-width: 48ch;
            font-size: 18px;
            line-height: 1.5;
            color: var(--q-ink-2);
            margin: 0;
        }

        .q-hero-cta { display: flex; gap: 12px; margin-top: 8px; }

        /* Section scaffolding */
        .q-section {
            max-width: var(--q-max);
            margin: 0 auto;
            padding: 96px var(--q-gutter);
            border-top: 1px solid var(--q-rule);
        }

        .q-section-head {
            display: grid;
            grid-template-columns: 160px 1fr auto;
            gap: 40px;
            align-items: start;
            padding-bottom: 64px;
        }

        .q-section-head .q-eyebrow { padding-top: 14px; }

        .q-section-title {
            font-family: var(--q-display);
            font-weight: 500;
            font-size: clamp(40px, 5vw, 60px);
            line-height: 1.02;
            letter-spacing: -0.03em;
            margin: 0;
            color: var(--q-ink);
        }

        /* Our Stack */
        .q-stack {
            border-top: 1px solid var(--q-rule);
            padding: 56px var(--q-gutter);
            max-width: var(--q-max);
            margin: 0 auto;
        }

        .q-stack-head {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 40px;
            align-items: center;
            margin-bottom: 36px;
        }

        .q-stack-title {
            font-family: var(--q-display);
            font-weight: 500;
            font-size: clamp(28px, 3vw, 40px);
            letter-spacing: -0.02em;
            margin: 0;
            color: var(--q-ink);
        }

        .q-stack-logos {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
        }

        .q-stack-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 90px;
            width: 110px;
            padding: 16px 12px 12px;
            background: var(--q-card);
            border: 1px solid var(--q-rule);
            border-radius: 12px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .q-stack-logo:hover {
            border-color: var(--q-accent);
            transform: translateY(-2px);
        }

        .q-stack-logo img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            display: block;
        }

        .q-stack-logo img.white-logo {
            filter: brightness(0) invert(1);
            width: 80px;
            height: auto;
        }

        .q-stack-logo-name {
            font-size: 10px;
            font-weight: 500;
            color: var(--q-ink-3);
            white-space: nowrap;
            text-align: center;
            font-family: var(--q-mono);
            letter-spacing: 0.03em;
        }

        /* Services */
        .q-service-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

        .q-service-card {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 40px 36px 36px;
            background: var(--q-card);
            border: 1px solid var(--q-rule);
            border-radius: 16px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .q-service-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -24px rgba(0, 0, 0, 0.4);
        }

        .q-service-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--q-rule-soft);
        }

        .q-service-name {
            font-family: var(--q-display);
            font-weight: 500;
            font-size: 32px;
            letter-spacing: -0.02em;
            margin: 0;
            color: var(--q-ink);
        }

        .q-service-summary { font-size: 16px; line-height: 1.5; color: var(--q-ink-2); margin: 0; max-width: 38ch; }
        .q-service-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; flex: 1; }

        .q-service-list li {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            font-size: 14.5px;
            color: var(--q-ink-2);
            border-bottom: 1px solid var(--q-rule-soft);
        }

        .q-service-list li:last-child { border-bottom: 0; }
        .q-service-dash { color: var(--q-accent); font-family: var(--q-mono); }

        .q-service-link {
            font-size: 14px;
            font-weight: 500;
            color: var(--q-ink);
            align-self: flex-start;
            padding-bottom: 2px;
            border-bottom: 1px solid var(--q-ink);
            transition: color 0.2s, border-color 0.2s;
        }

        .q-service-link:hover { color: var(--q-accent); border-color: var(--q-accent); }

        /* Contact */
        .q-contact { padding-bottom: 96px; }
        .q-contact-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 80px; align-items: start; }

        .q-contact-title {
            font-family: var(--q-display);
            font-weight: 500;
            font-size: clamp(44px, 5.5vw, 72px);
            line-height: 0.98;
            letter-spacing: -0.03em;
            margin: 16px 0 28px;
            color: var(--q-ink);
        }

        .q-contact-body { font-size: 16px; color: var(--q-ink-2); max-width: 40ch; }

        .q-contact-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px 40px;
            margin: 48px 0 0;
            padding-top: 36px;
            border-top: 1px solid var(--q-rule);
        }

        .q-contact-details dt {
            font-family: var(--q-mono);
            font-size: 10.5px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--q-ink-3);
            margin-bottom: 6px;
        }

        .q-contact-details dd { margin: 0; font-size: 14.5px; color: var(--q-ink); line-height: 1.5; }
        .q-contact-details a { border-bottom: 1px solid var(--q-rule); }
        .q-contact-details a:hover { border-color: var(--q-ink); }

        .q-form {
            background: var(--q-card);
            border: 1px solid var(--q-rule);
            border-radius: 16px;
            padding: 36px 36px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .q-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .q-field { display: flex; flex-direction: column; gap: 6px; }

        .q-field > span {
            font-family: var(--q-mono);
            font-size: 10.5px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--q-ink-3);
        }

        .q-field input,
        .q-field select,
        .q-field textarea {
            font-family: var(--q-sans);
            font-size: 15px;
            color: var(--q-ink);
            background: transparent;
            border: 0;
            border-bottom: 1px solid var(--q-rule);
            padding: 8px 0;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
            resize: vertical;
        }

        .q-field input:focus,
        .q-field select:focus,
        .q-field textarea:focus { border-bottom-color: var(--q-ink); }

        .q-field input::placeholder,
        .q-field textarea::placeholder { color: var(--q-ink-3); }

        .q-field select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238A847A' d='M0 0h10L5 6z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 2px center;
            padding-right: 24px;
            cursor: pointer;
        }

        .q-field select option { background: var(--q-card); color: var(--q-ink); }

        .q-form-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding-top: 12px;
            border-top: 1px solid var(--q-rule-soft);
        }

        .q-form-note { font-family: var(--q-mono); font-size: 11px; color: var(--q-ink-3); }

        .q-contact-thanks {
            background: var(--q-card);
            border: 1px solid var(--q-rule);
            border-radius: 16px;
            padding: 56px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .q-contact-thanks h3 {
            font-family: var(--q-display);
            font-size: 32px;
            font-weight: 500;
            margin: 8px 0 0;
            letter-spacing: -0.02em;
            color: var(--q-ink);
        }

        .q-contact-thanks p { color: var(--q-ink-2); margin: 0; max-width: 40ch; }

        /* Footer */
        .q-footer {
            border-top: 1px solid var(--q-rule);
            padding: 64px var(--q-gutter) 32px;
            max-width: var(--q-max);
            margin: 0 auto;
        }

        .q-footer-top {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 80px;
            padding-bottom: 48px;
            border-bottom: 1px solid var(--q-rule-soft);
        }

        .q-footer-brand { display: flex; gap: 14px; align-items: flex-start; }
        .q-footer-name { font-weight: 500; font-size: 20px; letter-spacing: -0.01em; color: var(--q-ink); }
        .q-footer-tag { font-size: 13px; color: var(--q-ink-3); margin-top: 2px; }
        .q-footer-cols { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; }

        .q-footer-cols h4 {
            font-family: var(--q-mono);
            font-size: 10.5px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--q-ink-3);
            margin: 0 0 16px;
        }

        .q-footer-cols ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
        .q-footer-cols li, .q-footer-cols a { font-size: 13.5px; color: var(--q-ink-2); }
        .q-footer-cols a:hover { color: var(--q-ink); }

        .q-footer-bottom {
            padding-top: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 12px;
            color: var(--q-ink-3);
            font-family: var(--q-mono);
        }

        .q-footer-sep { opacity: 0.5; }

        /* Responsive */
        @media (max-width: 960px) {
            .q-nav-links { display: none; }
            .q-hero { padding: 100px var(--q-gutter) 80px; }
            .q-section-head { grid-template-columns: 1fr; gap: 20px; padding-bottom: 40px; }
            .q-stack-head { grid-template-columns: 1fr; gap: 12px; }
            .q-service-grid { grid-template-columns: 1fr; }
            .q-contact-grid { grid-template-columns: 1fr; gap: 40px; }
            .q-footer-top { grid-template-columns: 1fr; gap: 32px; }
            .q-footer-cols { grid-template-columns: repeat(2, 1fr); gap: 20px; }
            .q-form-row { grid-template-columns: 1fr; }
        }
    </style>

                    </div>
                </section>
            );

        function Contact() {
            const [name, setName] = React.useState("");
            const [submitted, setSubmitted] = React.useState(false);
            const [sending, setSending] = React.useState(false);
            const submit = async (e) => {
                e.preventDefault();
                setSending(true);
                try {
                    const res = await fetch("https://api.web3forms.com/submit", {
                        method: "POST",
                        body: new FormData(e.target),
                        headers: { "Accept": "application/json" }
                    });
                    setSubmitted(true);
                } catch { setSubmitted(true); } finally { setSending(false); }
            };
            return (
                <section className="q-section q-contact" id="contact">
                    <div className="q-contact-grid">
                        <div className="q-contact-left">
                            <span className="q-eyebrow">Contact</span>
                            <h2 className="q-contact-title">Let's fix what isn't working.</h2>
                            <p className="q-contact-body">Every engagement starts with a 30-minute call, no pressure. We'll tell you honestly whether we're the right fit.</p>
                            <dl className="q-contact-details">
                                <div><dt>Email</dt><dd><a href="mailto:support@quorrait.com">support@quorrait.com</a></dd></div>
                                <div><dt>Phone</dt><dd><a href="tel:+19168669705">(916) 866-9705</a></dd></div>
                                <div><dt>Hours</dt><dd>Mon–Fri, 8am–6pm PT</dd></div>
                                <div><dt>Emergency</dt><dd>24/7 on-call line</dd></div>
                            </dl>
                        </div>
                        <div className="q-contact-right">
                            {submitted ? (
                                <div className="q-contact-thanks">
                                    <img src={LOGO_SRC} alt="Quorra" style={{height: "40px", width: "auto"}} />
                                    <h3>Thank you, {name || "friend"}.</h3>
                                    <p>We'll reply within 1–2 business days — usually much sooner. If it's urgent, our emergency line is always open.</p>
                                    <button className="q-btn q-btn-ghost" onClick={() => setSubmitted(false)}>Send another</button>
                                </div>
                            ) : (
                                <form className="q-form" onSubmit={submit}>
                                    <input type="hidden" name="access_key" value="7e90cbd7-2b63-4f71-9df9-e91b6d3cdfe5" />
                                    <input type="hidden" name="subject" value="New enquiry from quorrait.com" />
                                    <div className="q-form-row">
                                        <label className="q-field"><span>Your name</span><input required type="text" name="name" placeholder="Alex Rivera" onChange={(e) => setName(e.target.value)} /></label>
                                        <label className="q-field"><span>Company</span><input required type="text" name="company" placeholder="Rivera and Co." /></label>
                                    </div>
                                    <label className="q-field"><span>Email address</span><input required type="email" name="email" placeholder="alex@rivera.com" /></label>
                                    <label className="q-field"><span>What's on your mind?</span><textarea rows={4} name="message" placeholder="We're tired of our current MSP not answering tickets for three days…" /></label>
                                    <div className="q-form-foot">
                                        <span className="q-form-note">Usually reply within 1–2 business days.</span>
                                        <button type="submit" className="q-btn q-btn-primary" disabled={sending}>{sending ? "Sending…" : "Send enquiry →"}</button>
                                    </div>
                                </form>
                            )}
                        </div>
                    </div>
                </section>
            );
        }
