<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quorra IT</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbsAAAFYCAYAAADKuVIyAADWfElEQVR4nOz9d7xk2VnfC3+ftdYOFU7sOEkRSeQsMMaAhAIGLGRjbOzX77UNL0FCBGUsJEABJFBGIILNy174+jpgTDAYLAmQBMKAsI2RDEIJIU3onk4nVdhhhfvH2ruqTnfPSNMjeub0rO/nc7r61Km8a6/fejIkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUSiQx7oF5BIHG3Uyv/98r/3dmYJELr/B5BDj/GJE/rnk8UV9/h0Sw4/V1h9zYnEDYx5oF9AInF0UQuhulJnLhMi4UoBDCBOoa5R7DwQxF/1cVefWrEU1NXn8oAjCV7ioUESu0SimrmaSFxFfCAK0OWKGKLQXKvU3KNISf/Y8b9+IXEKx8c1BBOJG5LkxkwkfgrAA" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
        :root {
            --q-bg: #15140F;
            --q-ink: #F4F1EA;
            --q-ink-2: #C9C3B7;
            --q-ink-3: #8A847A;
            --q-rule: rgba(244, 241, 234, 0.16);
            --q-rule-soft: rgba(244, 241, 234, 0.08);
            --q-card: #1D1B16;
            --q-accent: #1CAADE;
            --q-hi-bg: #F4F1EA;
            --q-hi-fg: #15140F;
            --q-hi-fg-muted: rgba(21, 20, 15, 0.65);
            --q-hi-rule: rgba(21, 20, 15, 0.14);
            --q-sans: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            --q-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
            --q-display: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            --q-max: 1240px;
            --q-gutter: 40px;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body {
            font-family: var(--q-sans);
            background: var(--q-bg);
            color: var(--q-ink);
            font-size: 15px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        a { color: inherit; text-decoration: none; }
        em { font-style: italic; }

        .q-eyebrow {
            font-family: var(--q-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--q-ink-3);
        }

        /* Nav */
        .q-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 24px;
            padding: 18px var(--q-gutter);
            background: color-mix(in srgb, var(--q-bg) 82%, transparent);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            border-bottom: 1px solid var(--q-rule-soft);
        }

        .q-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--q-sans);
            font-weight: 500;
            font-size: 18px;
            letter-spacing: -0.01em;
            color: var(--q-ink);
        }

        .q-brand-logo {
            height: 36px;
            width: auto;
            display: block;
        }

        .q-nav-links {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 28px;
            justify-self: center;
        }

        .q-nav-links a {
            font-size: 13.5px;
            color: var(--q-ink-2);
            transition: color 0.2s;
        }

        .q-nav-links a:hover { color: var(--q-ink); }

        /* Buttons */
        .q-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 46px;
            padding: 0 22px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 999px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--q-sans);
        }

        .q-btn-primary { background: var(--q-ink); color: var(--q-bg); }
        .q-btn-primary:hover { background: var(--q-accent); color: #fff; }
        .q-btn-ghost { background: transparent; border-color: var(--q-rule); color: var(--q-ink); }
        .q-btn-ghost:hover { border-color: var(--q-ink); }
        .q-btn-outline { background: transparent; border-color: var(--q-ink); color: var(--q-ink); }
        .q-btn-outline:hover { background: var(--q-ink); color: var(--q-bg); }

        /* Hero */
        .q-hero {
            max-width: var(--q-max);
            margin: 0 auto;
            padding: 160px var(--q-gutter) 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 28px;
        }

        .q-hero-title {
            font-family: var(--q-display);
            font-weight: 500;
            font-size: clamp(64px, 10vw, 140px);
            line-height: 0.95;
            letter-spacing: -0.04em;
            margin: 0;
            color: var(--q-accent);
        }

        .q-hero-title .q-it { color: var(--q-ink); }

        .q-hero-sub {
            max-width: 48ch;
            font-size: 18px;
            line-height: 1.5;
            color: var(--q-ink-2);
            margin: 0;
        }

        .q-hero-cta { display: flex; gap: 12px; margin-top: 8px; }

        /* Section scaffolding */
        .q-section {
            max-width: var(--q-max);
            margin: 0 auto;
            padding: 96px var(--q-gutter);
            border-top: 1px solid var(--q-rule);
        }

        .q-section-head {
            display: grid;
            grid-template-columns: 160px 1fr auto;
            gap: 40px;
            align-items: start;
            padding-bottom: 64px;
        }

        .q-section-head .q-eyebrow { padding-top: 14px; }

        .q-section-title {
            font-family: var(--q-display);
            font-weight: 500;
            font-size: clamp(40px, 5vw, 60px);
            line-height: 1.02;
            letter-spacing: -0.03em;
            margin: 0;
            color: var(--q-ink);
        }

        /* Our Stack */
        .q-stack {
            border-top: 1px solid var(--q-rule);
            padding: 56px var(--q-gutter);
            max-width: var(--q-max);
            margin: 0 auto;
        }

        .q-stack-head {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 40px;
            align-items: center;
            margin-bottom: 36px;
        }

        .q-stack-logos {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
        }

        .q-stack-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 90px;
            width: 110px;
            padding: 16px 12px 12px;
            background: var(--q-card);
            border: 1px solid var(--q-rule);
            border-radius: 12px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .q-stack-logo:hover {
            border-color: var(--q-accent);
            transform: translateY(-2px);
        }

        .q-stack-logo img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            display: block;
        }

        .q-stack-logo img.white-logo {
            filter: brightness(0) invert(1);
            width: 80px;
            height: auto;
        }

        .q-stack-logo-name {
            font-size: 10px;
            font-weight: 500;
            color: var(--q-ink-3);
            white-space: nowrap;
            text-align: center;
            font-family: var(--q-mono);
            letter-spacing: 0.03em;
        }

        /* Services */
        .q-service-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

        .q-service-card {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 40px 36px 36px;
            background: var(--q-card);
            border: 1px solid var(--q-rule);
            border-radius: 16px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .q-service-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -24px rgba(0, 0, 0, 0.4);
        }

        .q-service-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--q-rule-soft);
        }

        .q-service-name {
            font-family: var(--q-display);
            font-weight: 500;
            font-size: 32px;
            letter-spacing: -0.02em;
            margin: 0;
            color: var(--q-ink);
        }

        .q-service-summary { font-size: 16px; line-height: 1.5; color: var(--q-ink-2); margin: 0; max-width: 38ch; }
        .q-service-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; flex: 1; }

        .q-service-list li {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            font-size: 14.5px;
            color: var(--q-ink-2);
            border-bottom: 1px solid var(--q-rule-soft);
        }

        .q-service-list li:last-child { border-bottom: 0; }
        .q-service-dash { color: var(--q-accent); font-family: var(--q-mono); }

        .q-service-link {
            font-size: 14px;
            font-weight: 500;
            color: var(--q-ink);
            align-self: flex-start;
            padding-bottom: 2px;
            border-bottom: 1px solid var(--q-ink);
            transition: color 0.2s, border-color 0.2s;
        }

        .q-service-link:hover { color: var(--q-accent); border-color: var(--q-accent); }

        /* Contact */
        .q-contact { padding-bottom: 96px; }
        .q-contact-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 80px; align-items: start; }

        .q-contact-title {
            font-family: var(--q-display);
            font-weight: 500;
            font-size: clamp(44px, 5.5vw, 72px);
            line-height: 0.98;
            letter-spacing: -0.03em;
            margin: 16px 0 28px;
            color: var(--q-ink);
        }

        .q-contact-body { font-size: 16px; color: var(--q-ink-2); max-width: 40ch; }

        .q-contact-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px 40px;
            margin: 48px 0 0;
            padding-top: 36px;
            border-top: 1px solid var(--q-rule);
        }

        .q-contact-details dt {
            font-family: var(--q-mono);
            font-size: 10.5px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--q-ink-3);
            margin-bottom: 6px;
        }

        .q-contact-details dd { margin: 0; font-size: 14.5px; color: var(--q-ink); line-height: 1.5; }
        .q-contact-details a { border-bottom: 1px solid var(--q-rule); }
        .q-contact-details a:hover { border-color: var(--q-ink); }

        .q-form {
            background: var(--q-card);
            border: 1px solid var(--q-rule);
            border-radius: 16px;
            padding: 36px 36px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .q-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .q-field { display: flex; flex-direction: column; gap: 6px; }

        .q-field > span {
            font-family: var(--q-mono);
            font-size: 10.5px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--q-ink-3);
        }

        .q-field input,
        .q-field select,
        .q-field textarea {
            font-family: var(--q-sans);
            font-size: 15px;
            color: var(--q-ink);
            background: transparent;
            border: 0;
            border-bottom: 1px solid var(--q-rule);
            padding: 8px 0;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
            resize: vertical;
        }

        .q-field input:focus,
        .q-field select:focus,
        .q-field textarea:focus { border-bottom-color: var(--q-ink); }

        .q-field input::placeholder,
        .q-field textarea::placeholder { color: var(--q-ink-3); }

        .q-field select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238A847A' d='M0 0h10L5 6z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 2px center;
            padding-right: 24px;
            cursor: pointer;
        }

        .q-field select option { background: var(--q-card); color: var(--q-ink); }

        .q-form-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding-top: 12px;
            border-top: 1px solid var(--q-rule-soft);
        }

        .q-form-note { font-family: var(--q-mono); font-size: 11px; color: var(--q-ink-3); }

        .q-contact-thanks {
            background: var(--q-card);
            border: 1px solid var(--q-rule);
            border-radius: 16px;
            padding: 56px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .q-contact-thanks h3 {
            font-family: var(--q-display);
            font-size: 32px;
            font-weight: 500;
            margin: 8px 0 0;
            letter-spacing: -0.02em;
            color: var(--q-ink);
        }

        .q-contact-thanks p { color: var(--q-ink-2); margin: 0; max-width: 40ch; }

        /* Footer */
        .q-footer {
            border-top: 1px solid var(--q-rule);
            padding: 64px var(--q-gutter) 32px;
            max-width: var(--q-max);
            margin: 0 auto;
        }

        .q-footer-top {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 80px;
            padding-bottom: 48px;
            border-bottom: 1px solid var(--q-rule-soft);
        }

        .q-footer-brand { display: flex; gap: 14px; align-items: flex-start; }
        .q-footer-name { font-weight: 500; font-size: 20px; letter-spacing: -0.01em; color: var(--q-ink); }
        .q-footer-tag { font-size: 13px; color: var(--q-ink-3); margin-top: 2px; }
        .q-footer-cols { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; }

        .q-footer-cols h4 {
            font-family: var(--q-mono);
            font-size: 10.5px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--q-ink-3);
            margin: 0 0 16px;
        }

        .q-footer-cols ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
        .q-footer-cols li, .q-footer-cols a { font-size: 13.5px; color: var(--q-ink-2); }
        .q-footer-cols a:hover { color: var(--q-ink); }

        .q-footer-bottom {
            padding-top: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 12px;
            color: var(--q-ink-3);
            font-family: var(--q-mono);
        }

        .q-footer-sep { opacity: 0.5; }

        /* Responsive */
        @media (max-width: 960px) {
            .q-nav-links { display: none; }
            .q-hero { padding: 100px var(--q-gutter) 80px; }
            .q-section-head { grid-template-columns: 1fr; gap: 20px; padding-bottom: 40px; }
            .q-stack-head { grid-template-columns: 1fr; gap: 12px; }
            .q-service-grid { grid-template-columns: 1fr; }
            .q-contact-grid { grid-template-columns: 1fr; gap: 40px; }
            .q-footer-top { grid-template-columns: 1fr; gap: 32px; }
            .q-footer-cols { grid-template-columns: repeat(2, 1fr); gap: 20px; }
            .q-form-row { grid-template-columns: 1fr; }
        }
    </style>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const LOGO_SRC = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbsAAAFYCAYAAADKuVIyAADWfElEQVR4nOz9d7xk2VnfC3+ftdYOFU7sOEkRSeQsMMaAhAIGLGRjbOzX77UNL0FCBGUsJEABJFBGIILNy174+jpgTDAYLAmQBMKAsI2RDEIJIU3onk4nVdhhhfvH2ruqTnfPSNMjeub0rO/nc7r61Km8a6/fejIkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUSiQx7oF5BIHG3Uyv/98r/3dmYJELr/B5BDj/GJE/rnk8UV9/h0Sw4/V1h9zYnEDYx5oF9AInF0UQuhulJnLhMi4UoBDCBOoa5R7DwQxF/1cVefWrEU1NXn8oAjCV7ioUESu0SimrmaSFxFfCAK0OWKGKLQXKvU3KNISf/Y8b9+IXEKx8c1BBOJG5LkxkwkfgrAA";

        function Nav() {
            return (
                <nav className="q-nav">
                    <a href="#top" className="q-brand">
                        <img src={LOGO_SRC} alt="Quorra IT" className="q-brand-logo" />
                    </a>
                    <ul className="q-nav-links">
                        <li><a href="#services">Services</a></li>
                        <li><a href="#contact">Contact</a></li>
                    </ul>
                    <div style={{justifySelf: "end"}} />
                </nav>
            );
        }

        function Hero() {
            return (
                <section className="q-hero" id="top">
                    <h1 className="q-hero-title">Quorra <span className="q-it">IT</span></h1>
                    <p className="q-hero-sub">Cybersecurity and managed IT for businesses.</p>
                    <div className="q-hero-cta">
                        <a href="#contact" className="q-btn q-btn-primary">Book a consultation</a>
                        <a href="#services" className="q-btn q-btn-ghost">What we do</a>
                    </div>
                </section>
            );
        }

        const VENDORS = [
            { name: "Microsoft 365", url: "https://www.google.com/s2/favicons?domain=microsoft.com&sz=64" },
            { name: "Google Workspace", url: "https://www.google.com/s2/favicons?domain=google.com&sz=64" },
            { name: "Bitdefender", url: "https://www.google.com/s2/favicons?domain=bitdefender.com&sz=64" },
            { name: "Dell", url: "https://www.google.com/s2/favicons?domain=dell.com&sz=64" },
            { name: "HP", url: "https://cdn.simpleicons.org/hp" },
            { name: "AWS", url: "https://www.google.com/s2/favicons?domain=aws.amazon.com&sz=64" },
            { name: "Ubiquiti", url: "https://www.google.com/s2/favicons?domain=ui.com&sz=64" },
            { name: "ClearlyIP", url: "https://clearlyip.com/wp-content/uploads/2019/07/clearly-IP-logo-ol.png", whiteLogo: true },
            { name: "n8n", url: "https://n8n.io/brandguidelines/logo-white.svg", whiteLogo: true },
        ];

        function Stack() {
            return (
                <div className="q-stack">
                    <div className="q-stack-head">
                        <span className="q-eyebrow">Our stack</span>
                    </div>
                    <div className="q-stack-logos">
                        {VENDORS.map((v) => (
                            <div key={v.name} className="q-stack-logo">
                                <img src={v.url} alt={v.name} className={v.whiteLogo ? "white-logo" : ""} />
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const SERVICES = [
            {
                title: "Managed IT",
                summary: "The quiet infrastructure behind a business that just works.",
                items: ["Helpdesk + remote support", "Endpoint management + patching", "Backup, recovery + continuity", "Microsoft 365 / Google Workspace"],
            },
            {
                title: "Cybersecurity",
                summary: "Pragmatic defense, tuned to the risks a small business actually faces.",
                items: ["Threat monitoring & response", "Email security & phishing simulations", "Identity, MFA & zero-trust access", "Vulnerability assessments"],
            },
        ];

        function Services() {
            return (
                <section className="q-section" id="services">
                    <div className="q-section-head">
                        <span className="q-eyebrow">Services</span>
                        <h2 className="q-section-title">What we do.</h2>
                    </div>
                    <div className="q-service-grid">
                        {SERVICES.map((s) => (
                            <article key={s.title} className="q-service-card">
                                <header className="q-service-header">
                                    <h3 className="q-service-name">{s.title}</h3>
                                </header>
                                <p className="q-service-summary">{s.summary}</p>
                                <ul className="q-service-list">
                                    {s.items.map((item, i) => (
                                        <li key={i}>
                                            <span className="q-service-dash" aria-hidden>—</span>
                                            <span>{item}</span>
                                        </li>
                                    ))}
                                </ul>
                                <a href="#contact" className="q-service-link">Discuss {s.title.toLowerCase()} →</a>
                            </article>
                        ))}
                    </div>
                </section>
            );
        }

        function Contact() {
            const [name, setName] = React.useState("");
            const [submitted, setSubmitted] = React.useState(false);
            const [sending, setSending] = React.useState(false);

            const submit = async (e) => {
                e.preventDefault();
                setSending(true);
                try {
                    const data = new FormData(e.target);
                    const res = await fetch("https://api.web3forms.com/submit", {
                        method: "POST",
                        headers: { "Accept": "application/json" },
                        body: data,
                    });
                    const json = await res.json();
                    if (json.success) {
                        setSubmitted(true);
                    } else {
                        alert("Something went wrong: " + (json.message || "unknown error"));
                    }
                } catch (err) {
                    alert("Network error — please email us directly at support@quorrait.com");
                } finally {
                    setSending(false);
                }
            };

            return (
                <section className="q-section q-contact" id="contact">
                    <div className="q-contact-grid">
                        <div className="q-contact-left">
                            <span className="q-eyebrow">Contact</span>
                            <h2 className="q-contact-title">Let's fix what isn't working.</h2>
                            <p className="q-contact-body">Every engagement starts with a 30-minute call, no pressure. We'll tell you honestly whether we're the right fit.</p>
                            <dl className="q-contact-details">
                                <div><dt>Email</dt><dd><a href="mailto:support@quorrait.com">support@quorrait.com</a></dd></div>
                                <div><dt>Phone</dt><dd><a href="tel:+19168669705">(916) 866-9705</a></dd></div>
                                <div><dt>Hours</dt><dd>Mon–Fri, 8am–6pm PT</dd></div>
                                <div><dt>Emergency</dt><dd>24/7 on-call line</dd></div>
                            </dl>
                        </div>
                        <div className="q-contact-right">
                            {submitted ? (
                                <div className="q-contact-thanks">
                                    <img src={LOGO_SRC} alt="Quorra" style={{height: "40px", width: "auto"}} />
                                    <h3>Thank you, {name || "friend"}.</h3>
                                    <p>We'll reply within 1–2 business days — usually much sooner. If it's urgent, our emergency line is always open.</p>
                                    <button className="q-btn q-btn-ghost" onClick={() => setSubmitted(false)}>Send another</button>
                                </div>
                            ) : (
                                <form className="q-form" onSubmit={submit}>
                                    {/* Web3Forms required fields */}
                                    <input type="hidden" name="access_key" value="7e90cbd7-2b63-4f71-9df9-e91b6d3cdfe5" />
                                    <input type="hidden" name="subject" value="New enquiry from quorrait.com" />
                                    <input type="hidden" name="from_name" value="Quorra IT Website" />
                                    {/* Honeypot — stays unchecked for real users, bots fill it in */}
                                    <input type="checkbox" name="botcheck" style={{display: "none"}} />

                                    <div className="q-form-row">
                                        <label className="q-field">
                                            <span>Your name</span>
                                            <input required type="text" name="name" placeholder="Alex Rivera" onChange={(e) => setName(e.target.value)} />
                                        </label>
                                        <label className="q-field">
                                            <span>Company</span>
                                            <input required type="text" name="company" placeholder="Rivera and Co." />
                                        </label>
                                    </div>
                                    <label className="q-field">
                                        <span>Email address</span>
                                        <input required type="email" name="email" placeholder="alex@rivera.com" />
                                    </label>
                                    <label className="q-field">
                                        <span>What's on your mind?</span>
                                        <textarea rows={4} name="message" placeholder="We're tired of our current MSP not answering tickets for three days…" />
                                    </label>
                                    <div className="q-form-foot">
                                        <span className="q-form-note">Usually reply within 1–2 business days.</span>
                                        <button type="submit" className="q-btn q-btn-primary" disabled={sending}>
                                            {sending ? "Sending…" : "Send enquiry →"}
                                        </button>
                                    </div>
                                </form>
                            )}
                        </div>
                    </div>
                </section>
            );
        }

        function Footer() {
            return (
                <footer className="q-footer">
                    <div className="q-footer-top">
                        <div className="q-footer-brand">
                            <img src={LOGO_SRC} alt="Quorra IT" style={{height: "32px", width: "auto"}} />
                            <div>
                                <div className="q-footer-name">Quorra IT</div>
                                <div className="q-footer-tag">Cybersecurity + Managed IT</div>
                            </div>
                        </div>
                        <div className="q-footer-cols">
                            <div>
                                <h4>Services</h4>
                                <ul>
                                    <li><a href="#services">Managed IT</a></li>
                                    <li><a href="#services">Cybersecurity</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4>Reach us</h4>
                                <ul>
                                    <li>support@quorrait.com</li>
                                    <li>(916) 866-9705</li>
                                    <li>Mon–Fri, 8am–6pm PT</li>
                                    <li>24/7 emergency</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div className="q-footer-bottom">
                        <span>© 2026 Quorra IT LLC</span>
                        <span className="q-footer-sep">·</span>
                        <a href="#">Privacy</a>
                        <span className="q-footer-sep">·</span>
                        <a href="#">Terms</a>
                    </div>
                </footer>
            );
        }

        function App() {
            return (
                <div>
                    <Nav />
                    <Hero />
                    <Contact />
                    <Stack />
                    <Services />
                    <Footer />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
