<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Customer portal</title>
<style>
.items{margin:-4px 0 12px;padding:8px 12px;background:#f8fafc;border-radius:10px;font-size:14px}.items>div{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
  :root { --brand:#e8590c; --ink:#111827; --muted:#6b7280; --line:#e3e7ee; --bad:#b42318; --good:#137a3c; }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; max-width: 100%; touch-action: pan-y; -webkit-text-size-adjust: 100%; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#f3f4f6; }
  main { max-width:620px; margin:0 auto; padding:16px max(14px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); display:grid; gap:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; min-width:0; }
  header { display:flex; align-items:center; gap:12px; }
  header img { max-height:44px; max-width:120px; object-fit:contain; }
  h1 { font-size:20px; margin:0 0 2px; overflow-wrap:anywhere; } h2 { font-size:13px; margin:0 0 6px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:14px 0; border-top:1px solid var(--line); }
  .row > div { min-width:0; }
  h2 + .row { border-top:0; }
  .badge { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:99px; background:#eef0f4; white-space:nowrap; }
  .badge.paid, .badge.approved { background:#ecfdf3; color:var(--good); } .badge.sent { background:#fff4e6; color:var(--brand); } .badge.late { background:#fef3f2; color:var(--bad); }
  a.btn, button { font:inherit; font-weight:700; padding:11px 16px; border:0; border-radius:10px; cursor:pointer; background:var(--brand); color:#fff; text-decoration:none; display:inline-block; touch-action:manipulation; min-height:44px; }
  a.btn.alt { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.6; }
  .msg { padding:12px; border-radius:10px; font-weight:600; margin-top:10px; } .ok { background:#ecfdf3; color:var(--good); } .err { background:#fef3f2; color:var(--bad); } .info { background:#e6f0fd; color:#164ea0; }
  .right { text-align:right; flex-shrink:0; }
  .due { background:#0f1720; color:#fff; border-radius:14px; padding:18px; }
  .due .big { font-size:32px; font-weight:800; letter-spacing:-.02em; }
  .due .muted { color:#aab4c3; }
  .pays { margin-top:4px; font-size:12px; color:var(--muted); }
  .contact { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
</style>
</head>
<body>
<main id="app"><div class="card muted">Loading...</div></main>
<script>
(function () {
  var q = new URLSearchParams(location.search), t = q.get("t"), api = (q.get("api") || "").replace(/\/$/, "");
  var demo = q.get("demo") === "1";
  var app = document.getElementById("app");
  var usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  var money = function (c) { return usd.format(c / 100); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var fmt = function (iso) { return new Date(String(iso).length === 10 ? iso + "T12:00:00" : iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
  var day = function (n) { return new Date(Date.now() + n * 86400000).toISOString().slice(0, 10); };
  function fail(m) { app.innerHTML = '<div class="card"><b>' + esc(m) + "</b></div>"; }
  if (!demo && (!t || !api)) return fail("This link is not valid.");
  var here = location.origin + location.pathname + "?" + (demo ? "demo=1" : "t=" + encodeURIComponent(t) + "&api=" + encodeURIComponent(q.get("api") || ""));
  var quoteBase = location.origin + location.pathname.replace(/portal\.html$/, "quote.html");

  var SAMPLE = {
    customer: "Dana Whitfield", can_pay: true,
    business: { name: "Summit Home Services", phone: "(916) 555-0142", email: "office@summithome.example" },
    invoices: [
      { id: "d1", number: 1042, status: "sent", issued_at: day(-20), due_at: day(-6), items: [{ description: "Replace kitchen faucet", qty: 1, unit_cents: 98000 }, { description: "Labor", qty: 6, unit_cents: 14333 }], total_cents: 184000, paid_cents: 50000, balance_cents: 134000, payments: [{ amount_cents: 50000, date: day(-18), method: "card" }] },
      { id: "d2", number: 1051, status: "sent", issued_at: day(-3), due_at: day(11), total_cents: 42500, paid_cents: 0, balance_cents: 42500, payments: [] },
      { id: "d3", number: 1018, status: "paid", issued_at: day(-70), due_at: day(-56), total_cents: 96000, paid_cents: 96000, balance_cents: 0, payments: [{ amount_cents: 96000, date: day(-60), method: "card" }] }
    ],
    quotes: [{ number: 311, title: "Water heater replacement", status: "sent", token: "demo", total_cents: 289000 }, { number: 288, title: "Drain cleaning", status: "approved", token: "demo", total_cents: 18500 }]
  };

  function render(d) {
    var b = d.business || {};
    var today = new Date().toISOString().slice(0, 10);
    var openInv = d.invoices.filter(function (i) { return i.status === "sent" && i.balance_cents > 0; });
    var totalDue = openInv.reduce(function (s, i) { return s + i.balance_cents; }, 0);
    var waiting = d.quotes.filter(function (x) { return x.status === "sent"; }).length;
    var h = '<div class="card"><header>' + (b.logo ? '<img src="' + esc(b.logo) + '" alt="">' : "") +
      '<div><h1>' + esc(b.name) + '</h1><div class="muted">Customer portal</div></div></header>' +
      '<div class="contact">' + (b.phone ? '<a class="btn alt" href="tel:' + esc(b.phone) + '">Call</a>' : "") + (b.email ? '<a class="btn alt" href="mailto:' + esc(b.email) + '">Email</a>' : "") + "</div></div>";
    h += '<div class="due"><div class="muted">Hi ' + esc(d.customer) + "</div>" +
      (totalDue > 0 ? '<div class="big">' + money(totalDue) + '</div><div class="muted">due across ' + openInv.length + (openInv.length === 1 ? " invoice" : " invoices") + "</div>" : '<div class="big">All paid up</div><div class="muted">You have nothing due right now.</div>') +
      (waiting ? '<div class="muted" style="margin-top:8px">' + waiting + (waiting === 1 ? " quote is" : " quotes are") + " waiting for your answer.</div>" : "") + "</div>";
    if (q.get("paid")) h += '<div class="msg ok">Thank you. Your payment is being processed and will show here shortly.</div>';
    h += '<div id="out"></div>';
    h += '<div class="card"><h2>Invoices</h2>';
    if (!d.invoices.length) h += '<div class="muted">No invoices yet.</div>';
    d.invoices.forEach(function (i) {
      var open = i.status === "sent" && i.balance_cents > 0;
      var late = open && i.due_at && String(i.due_at).slice(0, 10) < today;
      var badge = i.status === "paid" ? '<span class="badge paid">Paid</span>' : i.status === "void" ? '<span class="badge">Void</span>' : late ? '<span class="badge late">Overdue since ' + fmt(i.due_at) + "</span>" : '<span class="badge sent">Due ' + fmt(i.due_at) + "</span>";
      var pays = (i.payments || []).map(function (p) { return money(p.amount_cents) + " paid " + fmt(p.date) + (p.method && p.method !== "card" ? " (" + esc(p.method) + ")" : ""); }).join(" · ");
      h += '<div class="row"><div><b>Invoice #' + i.number + "</b> " + badge + '<div class="muted">Issued ' + fmt(i.issued_at) + "</div>" +
        (pays ? '<div class="pays">' + pays + "</div>" : "") + "</div>" +
        '<div class="right"><b>' + money(open ? i.balance_cents : i.total_cents) + "</b>" +
        (open && i.paid_cents > 0 ? '<div class="muted">of ' + money(i.total_cents) + "</div>" : "") +
        (open && d.can_pay ? '<div><button data-pay="' + esc(i.id) + '" style="margin-top:8px">Pay now</button></div>' : "") + "</div></div>" +
        (i.items && i.items.length ? '<div class="items">' + i.items.map(function (li) { return "<div><span>" + esc(li.description || "Item") + ' <span class="muted">' + (li.qty !== 1 ? li.qty + " x " + money(li.unit_cents) : "") + "</span></span><span>" + money(Math.round(li.qty * li.unit_cents)) + "</span></div>"; }).join("") + "</div>" : "");
    });
    if (openInv.length && !d.can_pay) h += '<div class="msg info">To pay these, please contact ' + esc(b.name || "the business") + ".</div>";
    h += "</div>";
    if (d.quotes.length) h += '<div class="card"><h2>Quotes</h2>';
    d.quotes.forEach(function (x) {
      var link = demo ? "#" : quoteBase + "?t=" + encodeURIComponent(x.token) + "&api=" + encodeURIComponent(q.get("api") || "");
      h += '<div class="row"><div><b>' + esc(x.title || "Quote #" + x.number) + '</b> <span class="badge ' + esc(x.status) + '">' + esc(x.status === "approved" ? "Accepted" : x.status === "sent" ? "Awaiting your answer" : x.status) + '</span><div class="muted">Quote #' + x.number + "</div></div>" +
        '<div class="right"><b>' + money(x.total_cents) + '</b><div><a class="btn alt' + (demo ? ' dq' : '') + '" style="margin-top:8px" href="' + link + '">' + (x.status === "sent" ? "Review" : "View") + "</a></div></div></div>";
    });
    if (d.quotes.length) h += "</div>";
    app.innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll(".dq"), function (a) {
      a.onclick = function (e) { e.preventDefault(); document.getElementById("out").innerHTML = '<div class="msg info">Preview only: on a live account this opens the quote so the customer can accept it.</div>'; };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-pay]"), function (btn) {
      btn.onclick = function () {
        if (demo) { document.getElementById("out").innerHTML = '<div class="msg info">Preview only: on a live account this opens a secure card payment page.</div>'; return; }
        btn.disabled = true; btn.textContent = "One moment...";
        fetch(api + "/portal-pay", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: t, invoice_id: btn.getAttribute("data-pay"), return_to: here }) })
          .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.url) throw new Error(j.error || "Could not start payment"); location.href = j.url; }); })
          .catch(function (e) { btn.disabled = false; btn.textContent = "Pay now"; document.getElementById("out").innerHTML = '<div class="msg err">' + esc(e.message) + "</div>"; });
      };
    });
  }
  if (demo) return render(SAMPLE);
  fetch(api + "/portal-view?t=" + encodeURIComponent(t))
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || (r.status === 404 ? "The customer portal is not switched on for this business yet (the portal-view function is not deployed)." : r.status === 401 ? "The customer portal needs to be redeployed with --no-verify-jwt." : (j.message || j.msg || "Could not load (error " + r.status + ")"))); return j; }); })
    .then(render).catch(function (e) { fail(e.message); });
})();
</script>
</body>
</html>
