<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Customer portal</title>
<style>
  :root { --brand:#e8590c; --ink:#111827; --muted:#6b7280; --line:#e3e7ee; --bad:#b42318; --good:#137a3c; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#f3f4f6; }
  main { max-width:620px; margin:0 auto; padding:16px; display:grid; gap:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; }
  header { display:flex; align-items:center; gap:12px; }
  header img { max-height:44px; max-width:140px; object-fit:contain; }
  h1 { font-size:20px; margin:0 0 2px; } h2 { font-size:15px; margin:0 0 8px; }
  .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .badge { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:99px; background:#eef0f4; }
  .badge.paid, .badge.approved { background:#ecfdf3; color:var(--good); } .badge.sent { background:#fff4e6; color:var(--brand); }
  a.btn, button { font:inherit; font-weight:700; padding:10px 14px; border:0; border-radius:10px; cursor:pointer; background:var(--brand); color:#fff; text-decoration:none; display:inline-block; }
  a.btn.alt { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.6; }
  .msg { padding:12px; border-radius:10px; font-weight:600; } .ok { background:#ecfdf3; color:var(--good); } .err { background:#fef3f2; color:var(--bad); }
  .right { text-align:right; }
</style>
</head>
<body>
<main id="app"><div class="card muted">Loading...</div></main>
<script>
(function () {
  var q = new URLSearchParams(location.search), t = q.get("t"), api = (q.get("api") || "").replace(/\/$/, "");
  var app = document.getElementById("app");
  var usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  var money = function (c) { return usd.format(c / 100); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var fmt = function (iso) { return new Date(String(iso).length === 10 ? iso + "T12:00:00" : iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
  function fail(m) { app.innerHTML = '<div class="card"><b>' + esc(m) + "</b></div>"; }
  if (!t || !api) return fail("This link is not valid.");
  var here = location.origin + location.pathname + "?t=" + encodeURIComponent(t) + "&api=" + encodeURIComponent(q.get("api") || "");
  var quoteBase = location.origin + location.pathname.replace(/portal\.html$/, "quote.html");

  function render(d) {
    var b = d.business || {};
    var h = '<div class="card"><header>' + (b.logo ? '<img src="' + esc(b.logo) + '" alt="">' : "") +
      '<div><h1>' + esc(b.name) + '</h1><div class="muted">' + esc([b.phone, b.email].filter(Boolean).join(" · ")) + "</div></div></header></div>";
    h += '<div class="card"><h1>Hi ' + esc(d.customer) + '</h1><div class="muted">Your quotes and invoices are here. Open a quote to accept it, or pay an invoice by card.</div>' +
      (q.get("paid") ? '<div class="msg ok" style="margin-top:10px">Thank you. Your payment is being processed and will show here shortly.</div>' : "") + '<div id="out"></div></div>';
    h += '<div class="card"><h2>Invoices</h2>';
    if (!d.invoices.length) h += '<div class="muted">No invoices yet.</div>';
    d.invoices.forEach(function (i) {
      var open = i.status === "sent" && i.balance_cents > 0;
      h += '<div class="row"><div><b>Invoice #' + i.number + '</b> <span class="badge ' + esc(i.status) + '">' + (i.status === "paid" ? "Paid" : i.status === "void" ? "Void" : "Due " + fmt(i.due_at)) + '</span><div class="muted">Issued ' + fmt(i.issued_at) + '</div></div>' +
        '<div class="right"><b>' + money(open ? i.balance_cents : i.total_cents) + "</b>" +
        (open && d.can_pay ? '<div><button data-pay="' + esc(i.id) + '" style="margin-top:6px">Pay now</button></div>' : "") + "</div></div>";
    });
    h += "</div>";
    h += '<div class="card"><h2>Quotes</h2>';
    if (!d.quotes.length) h += '<div class="muted">No quotes yet.</div>';
    d.quotes.forEach(function (x) {
      h += '<div class="row"><div><b>' + esc(x.title || "Quote #" + x.number) + '</b> <span class="badge ' + esc(x.status) + '">' + esc(x.status === "approved" ? "Accepted" : x.status === "sent" ? "Awaiting your answer" : x.status) + '</span><div class="muted">Quote #' + x.number + "</div></div>" +
        '<div class="right"><b>' + money(x.total_cents) + '</b><div><a class="btn alt" style="margin-top:6px" href="' + quoteBase + "?t=" + encodeURIComponent(x.token) + "&api=" + encodeURIComponent(q.get("api") || "") + '">View</a></div></div></div>';
    });
    h += "</div>";
    app.innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll("[data-pay]"), function (btn) {
      btn.onclick = function () {
        btn.disabled = true; btn.textContent = "One moment...";
        fetch(api + "/portal-pay", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: t, invoice_id: btn.getAttribute("data-pay"), return_to: here }) })
          .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.url) throw new Error(j.error || "Could not start payment"); location.href = j.url; }); })
          .catch(function (e) { btn.disabled = false; btn.textContent = "Pay now"; document.getElementById("out").innerHTML = '<div class="msg err" style="margin-top:10px">' + esc(e.message) + "</div>"; });
      };
    });
  }
  fetch(api + "/portal-view?t=" + encodeURIComponent(t))
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "Could not load"); return j; }); })
    .then(render).catch(function (e) { fail(e.message); });
})();
</script>
</body>
</html>
