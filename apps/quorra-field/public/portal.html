<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<link rel="icon" href="favicon-32.png" type="image/png" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Customer portal</title>
<style>
.items{margin:-4px 0 12px;padding:8px 12px;background:#f8fafc;border-radius:10px;font-size:14px}.items>div{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
  :root { --brand:#e8590c; --ink:#111827; --muted:#6b7280; --line:#e3e7ee; --bad:#b42318; --good:#137a3c; }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; max-width: 100%; touch-action: pan-y; -webkit-text-size-adjust: 100%; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#f3f4f6; -webkit-user-select:none; user-select:none; }
  input, textarea, [contenteditable="true"] { -webkit-user-select:text; user-select:text; caret-color:auto; }
  main { max-width:760px; margin:0 auto; padding:16px max(14px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); display:grid; gap:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; min-width:0; }
  header { display:flex; align-items:center; gap:12px; }
  header img { max-height:44px; max-width:120px; object-fit:contain; }
  h1 { font-size:20px; margin:0 0 2px; overflow-wrap:anywhere; } h2 { font-size:13px; margin:0 0 6px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:14px 0; border-top:1px solid var(--line); }
  .row > div { min-width:0; }
  h2 + .row { border-top:0; }
  .badge { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:99px; background:#eef0f4; white-space:nowrap; }
  .badge.paid, .badge.approved { background:#ecfdf3; color:var(--good); } .badge.sent { background:#fff4e6; color:var(--brand); } .badge.late { background:#fef3f2; color:var(--bad); }
  a.btn, button { font:inherit; font-weight:700; padding:11px 16px; border:0; border-radius:10px; cursor:pointer; background:var(--brand); color:#fff; text-decoration:none; display:inline-block; touch-action:manipulation; min-height:44px; }
  a.btn.alt { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.6; }
  .msg { padding:12px; border-radius:10px; font-weight:600; margin-top:10px; } .ok { background:#ecfdf3; color:var(--good); } .err { background:#fef3f2; color:var(--bad); } .info { background:#e6f0fd; color:#164ea0; }
  .right { text-align:right; flex-shrink:0; }
  .due { background:#0f1720; color:#fff; border-radius:14px; padding:18px; }
  .due .big { font-size:32px; font-weight:800; letter-spacing:-.02em; }
  .due .muted { color:#aab4c3; }
  .pays { margin-top:4px; font-size:12px; color:var(--muted); }
  .contact { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
</style>
</head>
<body>
<main id="app"><div class="card muted">Loading...</div></main>
<script src="portal.js"></script>

</body>
</html>
