<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Request service</title>
<style>
  :root { --brand:#e8590c; --ink:#111827; --muted:#6b7280; --line:#d8dde6; --bad:#b42318; --good:#137a3c; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:transparent; }
  form { max-width:560px; margin:0 auto; padding:16px; display:grid; gap:12px; }
  h1 { font-size:20px; margin:0; }
  p { margin:0; color:var(--muted); }
  label { display:grid; gap:4px; font-weight:600; font-size:13px; }
  input, textarea { font:inherit; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  input:focus, textarea:focus { outline:2px solid var(--brand); outline-offset:0; border-color:var(--brand); }
  textarea { min-height:90px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:480px) { .row { grid-template-columns:1fr; } }
  button { font:inherit; font-weight:700; padding:13px; border:0; border-radius:10px; background:var(--brand); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .msg { padding:12px; border-radius:10px; font-weight:600; }
  .err { background:#fef3f2; color:var(--bad); }
  .ok { background:#ecfdf3; color:var(--good); }
</style>
</head>
<body>
<form id="f" novalidate>
  <h1>Request service</h1>
  <p>Tell us what you need and we will get back to you shortly.</p>
  <div class="row">
    <label>Full name *<input name="name" autocomplete="name" required /></label>
    <label>Phone<input name="phone" type="tel" autocomplete="tel" /></label>
  </div>
  <label>Email<input name="email" type="email" autocomplete="email" /></label>
  <label>Service address<input name="address" autocomplete="street-address" /></label>
  <label>Service requested<input name="service" placeholder="e.g. AC repair, water heater replacement" /></label>
  <label>Additional details<textarea name="message"></textarea></label>
  <div class="hp" aria-hidden="true"><label>Leave blank<input name="hp" tabindex="-1" autocomplete="off" /></label></div>
  <div id="out" role="status"></div>
  <button id="go" type="submit">Request service</button>
</form>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var key = q.get("k"), api = q.get("api");
  var f = document.getElementById("f"), out = document.getElementById("out"), go = document.getElementById("go");
  function show(cls, text) { out.className = "msg " + cls; out.textContent = text; }
  if (!key || !api) show("err", "This form is not set up correctly.");
  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var d = Object.fromEntries(new FormData(f).entries());
    if (!d.name.trim()) return show("err", "Please enter your name.");
    if (!d.phone.trim() && !d.email.trim()) return show("err", "Please enter a phone number or email so we can reach you.");
    d.k = key; go.disabled = true; show("", "");
    fetch(api.replace(/\/$/, "") + "/lead-intake", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (r) {
        if (!r.ok) { go.disabled = false; return show("err", r.j.error || "Something went wrong. Please try again."); }
        f.reset(); go.textContent = "Request sent";
        show("ok", "Thank you. Your request was sent and we will contact you shortly.");
      })
      .catch(function () { go.disabled = false; show("err", "Could not send your request. Please check your connection and try again."); });
  });
})();
</script>
</body>
</html>
