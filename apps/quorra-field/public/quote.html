<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="favicon-32.png" type="image/png" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Your quote</title>
<style>
  :root { --brand:#e8590c; --ink:#111827; --muted:#6b7280; --line:#e3e7ee; --bad:#b42318; --good:#137a3c; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#f3f4f6; -webkit-user-select:none; user-select:none; }
  input, textarea, [contenteditable="true"], .copy { -webkit-user-select:text; user-select:text; caret-color:auto; }
  main { max-width:620px; margin:0 auto; padding:16px; display:grid; gap:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; }
  header { display:flex; align-items:center; gap:12px; }
  header img { max-height:44px; max-width:140px; object-fit:contain; }
  h1 { font-size:20px; margin:0 0 2px; }
  .muted { color:var(--muted); font-size:13px; }
  .li { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--line); }
  .li:first-child { border-top:0; }
  .tot { display:flex; justify-content:space-between; padding:3px 0; }
  .tot.g { font-size:18px; font-weight:800; border-top:2px solid var(--ink); margin-top:6px; padding-top:8px; }
  label { display:grid; gap:4px; font-weight:600; font-size:13px; margin-top:10px; }
  input, select { font:inherit; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  button { font:inherit; font-weight:700; padding:13px; border:0; border-radius:10px; width:100%; cursor:pointer; margin-top:12px; }
  .accept { background:var(--good); color:#fff; }
  .decline { background:#fff; color:var(--bad); border:1px solid var(--line); }
  button:disabled { opacity:.6; }
  .msg { padding:12px; border-radius:10px; font-weight:600; margin-top:12px; }
  .ok { background:#ecfdf3; color:var(--good); } .err { background:#fef3f2; color:var(--bad); }
  .cal { margin-top:12px; border:1px solid var(--line); border-radius:12px; padding:10px; background:#fff; }
  .cal-h { display:flex; align-items:center; justify-content:space-between; font-weight:800; }
  .cal-h button { width:36px; margin:0; padding:6px; background:#f1f5f9; color:var(--ink); }
  .cal-g { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:8px; text-align:center; }
  .cal-g b { font-size:11px; color:#64748b; }
  .cal-g .d { margin:0; padding:8px 0; background:#fff; color:#cbd5e1; border:1px solid transparent; font-weight:600; }
  .cal-g .d.has { color:#9a3412; border-color:#fdba74; background:#ffedd5; font-weight:800; }
  .cal-g .d.today { box-shadow: inset 0 0 0 2px var(--ink); color:var(--ink); }
  .cal-g .d.today::after { content:""; display:block; width:5px; height:5px; border-radius:50%; background:var(--ink); margin:2px auto -3px; }
  .cal-key { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:#64748b; margin-top:8px; }
  .cal-key i { display:inline-block; width:12px; height:12px; border-radius:4px; vertical-align:-2px; margin-right:5px; }
  .cal-g .d.sel { background:var(--ink); color:#fff; border-color:var(--ink); }
  .cal-g .d:disabled { opacity:1; cursor:default; }
  .times { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .slot { margin:0; padding:11px 4px; background:#fff; border:1px solid var(--line); color:var(--ink); }
  .slot.on { background:var(--ink); color:#fff; }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; margin-top:12px; }
  @media print { body { background:#fff; } .actions { display:none; } }
</style>
</head>
<body>
<main id="app"><div class="card muted">Loading your quote...</div></main>
<script src="quote.js"></script>

</body>
</html>
