# Codemagic builds for Quorra Dispatch (iOS and Android). The app is the web app wrapped with Capacitor.
# One-time setup in Codemagic (Teams > Environment variables, group "quorra_app"):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# iOS: connect your Apple Developer account in Codemagic (App Store Connect API key + automatic code signing).
# Android: upload your keystore in Codemagic (Code signing identities > Android keystores), reference name "quorra_keystore".
workflows:
  ios-release:
    name: Quorra Dispatch iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/quorra-field
    integrations:
      app_store_connect: Quorra IT
    environment:
      groups: [quorra_app]
      node: 20
      xcode: latest
      cocoapods: default
      # Uploaded Codemagic identities, applied by `xcode-project use-profiles`.
      # This does not run `app-store-connect fetch-signing-files --create`.
      # Regenerate the App Store profile after Tap to Pay is on the App ID and
      # replace the uploaded profile named quorra_dispatch_app_store before a signed build will succeed.
      ios_signing:
        provisioning_profiles:
          - quorra_dispatch_app_store
        certificates:
          - quorra_dispatch_dist
      vars:
        BUNDLE_ID: com.quorrait.dispatch
        APP_STORE_APPLE_ID: 6832824662
    scripts:
      - name: Install packages
        script: npm ci
      - name: Build the web app
        script: npm run build:app
      - name: Add the iOS project and sync
        script: |
          [ -d ios ] || npx cap add ios
          npx @capacitor/assets generate --ios || true
          npx cap sync ios
          node scripts/prepare-native.mjs ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build number and archive
        script: |
          cd ios/App
          if LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID"); then
            agvtool new-version -all $((LATEST + 1))
          else
            agvtool new-version -all "$BUILD_NUMBER"
          fi
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App \
            --disable-xcpretty \
            --verbose
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - apps/quorra-field/ios/App/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/apps/quorra-field/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Uploads the build and submits it to TestFlight. Does not set submit_to_app_store, so it does not send the app to App Store review.
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Quorra Dispatch Android
    instance_type: linux_x2
    max_build_duration: 60
    working_directory: apps/quorra-field
    environment:
      groups: [quorra_app]
      node: 20
      java: 17
      android_signing: [quorra_keystore]
    scripts:
      - name: Install packages
        script: npm ci
      - name: Build the web app
        script: npm run build:app
      - name: Add the Android project and sync
        script: |
          [ -d android ] || npx cap add android
          npx @capacitor/assets generate --android || true
          npx cap sync android
          node scripts/prepare-native.mjs android
      - name: Firebase config if provided
        script: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON is not set; building without Firebase"
          fi
      - name: Build signed app bundle
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - apps/quorra-field/android/app/build/outputs/bundle/release/*.aab

  android-test:
    name: Quorra Dispatch Android test APK
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: apps/quorra-field
    environment:
      groups: [quorra_app]
      node: 20
      java: 17
    scripts:
      - name: Install packages
        script: npm ci
      - name: Build the web app
        script: npm run build:app
      - name: Add the Android project and sync
        script: |
          [ -d android ] || npx cap add android
          npx @capacitor/assets generate --android || true
          npx cap sync android
          node scripts/prepare-native.mjs android
      - name: Firebase config if provided
        script: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON is not set; building without Firebase"
          fi
      - name: Build test APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew assembleDebug
    artifacts:
      - apps/quorra-field/android/app/build/outputs/apk/debug/*.apk
